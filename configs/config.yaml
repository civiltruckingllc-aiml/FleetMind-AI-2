project:
  name: fleetmind_dispatch_risk
  random_state: 42

data:
  target: Late_delivery_risk
  group_column: Order Id
  test_size: 0.20
  validation_size: 0.20
  raw_path: data/raw/DataCoSupplyChainDataset.csv
  forbidden_predictors:
    - Late_delivery_risk
    - Days for shipping (real)
    - Delivery Status
    - Order Status
    - shipping date (DateOrders)

training:
  primary_metric: f1
  models:
    logistic_C_0.1:
      algorithm: logistic_regression
      C: 0.1
      max_iter: 1000

    logistic_C_1.0:
      algorithm: logistic_regression
      C: 1.0
      max_iter: 1000

    random_forest_100:
      algorithm: random_forest
      n_estimators: 100
      max_depth: 12
      n_jobs: -1

    random_forest_200:
      algorithm: random_forest
      n_estimators: 200
      max_depth: 18
      n_jobs: -1

    hist_gradient_boosting:
      algorithm: hist_gradient_boosting
      max_iter: 150
      max_depth: 8

mlflow:
  experiment_name: FleetMind_Dispatch_Risk

llm:
  provider: nebius
  model: Qwen/Qwen3-30B-A3B-Instruct-2507
  temperature: 0.1
